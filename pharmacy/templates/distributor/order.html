{% extends 'base.html' %}
 
 {% block content %}
<!-- [View] Distributor Orders -->
            <div id="view-distributor-orders" class="view-section hidden h-full flex flex-col">
                <div class="bg-white rounded-[2.5rem] p-8 shadow-sm flex-1 flex flex-col border border-slate-50">
                    <div class="flex justify-between items-end mb-6">
                        <div><h2 class="text-2xl font-extrabold text-slate-900">Hospital Purchase Orders</h2><p class="text-sm font-bold text-slate-400 mt-1">Distributors confirm orders, bind medicine batches, and ship.</p></div>
                    </div>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-slate-400 text-xs uppercase font-extrabold border-b border-slate-100">
                                <th class="py-4 px-4">Order ID</th>
                                <th class="py-4 px-4">Requestor</th>
                                <th class="py-4 px-4">Date Created</th>
                                <th class="py-4 px-4">Status</th>
                                <th class="py-4 px-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm font-bold text-slate-700">
                            <tr class="hover:bg-slate-50 border-b border-slate-50">
                                <td class="py-4 px-4 font-mono text-slate-500">ORD-2026-001</td>
                                <td class="py-4 px-4">H-01 (Main Branch)</td>
                                <td class="py-4 px-4">2026-05-22</td>
                                <td class="py-4 px-4"><span class="bg-soft-yellow text-white px-3 py-1.5 rounded-full text-xs shadow-sm">Pending</span></td>
                                <td class="py-4 px-4 text-right">
                                    <button class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs hover:bg-slate-700 shadow-sm">Enter Batch & Ship</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
{% endblock %}
