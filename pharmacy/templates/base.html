<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNBU Modern Hospital Pharmacy System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #b8c6d3; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
        
        .bg-soft-blue { background-color: #89cce7; }
        .bg-soft-orange { background-color: #f16847; }
        .bg-soft-green { background-color: #a0d4a4; }
        .bg-soft-yellow { background-color: #f6b566; }
        .text-soft-orange { color: #f16847; }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-out { animation: fadeOut 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; pointer-events: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.05); } }

        /* Dynamic Nav Styles */
        .nav-item { transition: all 0.3s ease; }
        .nav-active { background-color: #b9e3f3; color: #0f172a; font-weight: 700; }
        .nav-inactive { color: #64748b; font-weight: 600; }
        .nav-inactive:hover { color: #0f172a; background-color: rgba(255,255,255,0.6); }

        /* Glassmorphism Login */
        .glass-login {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 24px 48px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4 md:p-6 relative">

    <!-- ================= Main Workspace ================= -->
    <main id="main-app" class="w-full h-full max-w-[1600px] bg-[#f0f4f8] rounded-[2.5rem] shadow-2xl flex flex-col p-6 md:p-8 relative overflow-hidden">
        
        <!-- ================= Header ================= -->
        <header class="flex items-center justify-between mb-8 z-20">
            <!-- Left: Logo & Page Title -->
            <div class="flex items-center">
                <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mr-4 shadow-sm">
                    <i class="ph-bold ph-pill text-2xl text-white transform -rotate-45"></i>
                </div>
                <div>
                    <h1 id="page-main-title" class="text-3xl font-extrabold text-slate-900 tracking-tight">Data Statistics</h1>
                    <p id="page-sub-title" class="text-xs font-bold text-slate-500 mt-0.5">Admin Workspace</p>
                </div>
            </div>

            <!-- Right: Dynamic Nav & Profile -->
            <div class="flex items-center bg-white/80 backdrop-blur-md px-2 py-1.5 rounded-full shadow-[0_8px_30px_rgba(0,0,0,0.04)] border border-white">
                <!-- Nav Pills -->
                <nav id="dynamic-nav" class="hidden lg:flex items-center space-x-1 pr-4 border-r border-slate-200 mr-4">
                    <!-- Auto generated by JS -->
                </nav>

                <!-- Profile & Switch Dropdown -->
                <div class="relative flex items-center pr-2">
                    <div class="flex flex-col items-end mr-3 text-right">
                        <span class="font-extrabold text-slate-800 text-sm leading-tight" id="user-greeting">System Admin</span>
                        <span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md mt-0.5" id="user-role-label">Admin</span>
                    </div>
                    
                    <div class="flex items-center justify-center w-11 h-11 rounded-full bg-slate-100 border-2 border-white shadow-sm">
                        <i id="user-icon" class="ph-fill ph-shield-check text-2xl text-slate-700"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- ================= View Render Area ================= -->
        <div class="flex-1 overflow-y-auto relative rounded-3xl pb-4">
        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <div class="bg-white border border-emerald-100 text-emerald-700 rounded-2xl px-5 py-3 text-sm font-bold shadow-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}
        {% endblock %}
        <!-- Generic Placeholder View -->
            <div id="view-generic" class="view-section hidden h-full">
                <div class="w-full h-full bg-white rounded-[2.5rem] shadow-sm flex flex-col items-center justify-center border border-slate-50 relative overflow-hidden">
                    <div class="w-24 h-24 rounded-[2rem] bg-slate-100 flex items-center justify-center mb-6 z-10"><i id="generic-icon" class="ph-fill ph-check-square-offset text-5xl text-slate-400"></i></div>
                    <h2 id="generic-title" class="text-3xl font-extrabold text-slate-900 z-10 mb-2">Loading...</h2>
                    <p id="generic-desc" class="text-sm font-bold text-slate-500 z-10 mb-8 max-w-md text-center">Feature Description</p>
                    <div class="bg-blue-50 border border-blue-100 text-blue-600 rounded-2xl px-6 py-3 font-bold text-sm z-10">Frontend skeleton is ready. Awaiting backend SQL endpoints.</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ================= 1. Strict Routing Config (10 Pages mapped) =================
        const roleConfig = {

    'Admin': {
        name: 'System Admin',
        label: 'Admin',
        icon: 'ph-shield-check',
        menus: [
            {
                name: 'Dashboard',
                url: '/admin/dashboard/',
                icon: 'ph-chart-bar'
            },
            {
                name: 'Medicines',
                url: '/admin/medicines/',
                icon: 'ph-pill'
            },
            {
                name: 'Doctors',
                url: '/admin/users/doctors/',
                icon: 'ph-user'
            },
            {
                name: 'Pharmacists',
                url: '/admin/users/pharmacists/',
                icon: 'ph-first-aid'
            },
            {
                name: 'Distributors',
                url: '/admin/users/distributors/',
                icon: 'ph-truck'
            },
            {
                name: 'Suppliers',
                url: '/admin/suppliers/',
                icon: 'ph-warehouse'
            }
        ]
    },

    'Doctor': {
        name: 'Doctor',
        label: 'Doctor',
        icon: 'ph-stethoscope',
        menus: [
            {
                name: 'Dashboard',
                url: '/doctor/dashboard/',
                icon: 'ph-house'
            },
            {
                name: 'Prescribe',
                url: '/doctor/prescribe/',
                icon: 'ph-pencil-simple'
            }
        ]
    },

    'Pharmacist': {
        name: 'Pharmacist',
        label: 'Pharmacist',
        icon: 'ph-first-aid',
        menus: [
            {
                name: 'Dashboard',
                url: '/pharmacist/dashboard/',
                icon: 'ph-house'
            },
            {
                name: 'Inventory',
                url: '/pharmacist/inventory/',
                icon: 'ph-package'
            },
            {
                name: 'Audit',
                url: '/pharmacist/audit/',
                icon: 'ph-check-square-offset'
            }
        ]
    },

    'Distributor': {
        name: 'Distributor',
        label: 'Distributor',
        icon: 'ph-truck',
        menus: [
            {
                name: 'Dashboard',
                url: '/distributor/dashboard/',
                icon: 'ph-house'
            },
            {
                name: 'Orders',
                url: '/distributor/orders/',
                icon: 'ph-receipt'
            },
            {
                name: 'Shipments',
                url: '/distributor/shipments/',
                icon: 'ph-package'
            }
        ]
    }
};

        function logout() {
            
            const overlay = document.getElementById('login-overlay');
            const app = document.getElementById('main-app');
            
            app.classList.remove('fade-in');
            app.classList.add('opacity-0');
            
            setTimeout(() => {
                overlay.style.display = 'flex';
                overlay.classList.remove('fade-out');
                overlay.classList.add('fade-in');
            }, 300);
        }


        // ================= 3. Admin Chart Render =================
        function renderAdminChart() {
            const ctx = document.getElementById('adminTrendChart');
            if(!ctx) return;
            const context = ctx.getContext('2d');
            let gradient = context.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(137, 204, 231, 0.4)');
            gradient.addColorStop(1, 'rgba(137, 204, 231, 0.0)');

            new Chart(context, {
                type: 'line',
                data: {
                    labels: window.chartLabels,
                    datasets: [{
                        label: 'Prescriptions Volume',
                        data: window.chartData,
                        borderColor: '#89cce7',
                        backgroundColor: gradient,
                        borderWidth: 4,
                        fill: true,
                        tension: 0.4
                    }, {
                        label: 'Inventory Trend',
                        data: window.inventoryData || [],
                        borderColor: '#a0d4a4',
                        backgroundColor: 'rgba(160, 212, 164, 0.12)',
                        borderWidth: 3,
                        fill: false,
                        tension: 0.35
                    }, {
                        label: 'Expired Batches',
                        data: window.expiredData || [],
                        borderColor: '#f16847',
                        backgroundColor: 'rgba(241, 104, 71, 0.12)',
                        borderWidth: 3,
                        fill: false,
                        tension: 0.35
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: true, labels: { boxWidth: 10, font: { weight: 'bold' } } } },
                    scales: {
                        y: { border: {display: false}, grid: { color: '#f1f5f9' } },
                        x: { border: {display: false}, grid: { display: false } }
                    }
                }
            });
        }
        function initRole(role) {
            const config = roleConfig[role];
            document.getElementById('user-greeting').innerText = config.name;
            document.getElementById('user-role-label').innerText = config.label;
            document.getElementById('page-sub-title').innerText = `${config.label} Workspace`;
            const nav = document.getElementById('dynamic-nav');
            nav.innerHTML = '';
            nav.classList.remove('hidden');
            const currentPath = window.location.pathname;
            config.menus.forEach(menu => {
            const button = document.createElement('button');
            const isActive = currentPath === menu.url;
            button.className =
                `nav-item ${isActive ? 'nav-active' : 'nav-inactive'} px-4 py-2 rounded-full text-sm flex items-center gap-2`;
            button.innerHTML = `
                <i class="ph-fill ${menu.icon}"></i>
                <span>${menu.name}</span>
                `;
            button.onclick = () => {
            window.location.href = menu.url;
            };
            nav.appendChild(button);
            if (isActive) {
                document.getElementById('page-main-title').innerText = menu.name;
            }
            });
        }
        if (document.getElementById('adminTrendChart')) {
            renderAdminChart();
        }
        initRole('{{ request.session.role|default:"Admin" }}');
    </script>
</body>
</html>
